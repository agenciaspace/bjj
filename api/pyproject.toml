# This file tells Vercel to install the backend dependencies
# The backend API will be served from /api route

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bjj-face-api"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.16.0",
    "python-multipart==0.0.20",
    "opencv-python-headless==4.10.0.84",
    "mangum==0.19.0",
    "numpy==1.26.0",
    "scipy>=1.11.0",
]