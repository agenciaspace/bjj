# This file tells Vercel to install the backend dependencies
# The backend API will be served from /api route

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bjj-deepface-api"
version = "1.0.0"
dependencies = [
    "fastapi",
    "deepface",
    "uvicorn",
    "python-multipart",
    "opencv-python",
    "mangum"
]